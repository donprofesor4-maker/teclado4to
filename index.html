<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Práctica de direcciones</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563EB'/%3E%3Ctext x='50' y='70' font-size='46' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%23fff'%3E%C3%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --tinta:#12263F; --gris:#7A8AA0; --verde:#0E9F6E;
  --rojo:#E11D48; --cursor:#2563EB; --linea:#DDE5EF;
}
html,body{height:100%}
body{
  font-family:"Baloo 2","Fredoka",system-ui,sans-serif;
  background:#F7F9FC;color:var(--tinta);
  display:flex;flex-direction:column;
  min-height:100vh;overflow:hidden;
}
.barra{
  display:flex;align-items:center;gap:14px;
  padding:13px 24px;border-bottom:2px solid var(--linea);
  background:#fff;flex-wrap:wrap;
}
.marca{font-size:1.12rem;font-weight:800;display:flex;align-items:center;gap:9px;white-space:nowrap}
.marca span{
  background:var(--cursor);color:#fff;width:29px;height:29px;border-radius:8px;
  display:grid;place-items:center;font-size:.98rem;
}
.contador{font-size:.98rem;color:var(--gris);font-weight:600;margin-left:auto;white-space:nowrap}
.contador b{color:var(--tinta);font-size:1.12rem}
.progreso{height:7px;background:var(--linea);flex:0 0 auto}
.progreso i{display:block;height:100%;background:var(--verde);width:0;transition:width .3s ease}

.escena{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:30px;padding:22px;min-height:0;
}
.caption{font-size:1rem;color:var(--gris);font-weight:600;text-align:center}
.direccion{
  font-size:clamp(2.5rem,8.2vw,6.4rem);font-weight:800;line-height:1.24;
  text-align:center;letter-spacing:.01em;word-break:break-word;
  max-width:22ch;display:flex;flex-wrap:wrap;justify-content:center;
}
.car{position:relative;display:inline-block;transition:color .12s,background .12s,transform .12s}
.car.pend{color:#BAC7D9}
.car.ok{color:var(--verde)}
.car.mal{color:var(--rojo)}
.car.actual:not(.mal)::after{
  content:"";position:absolute;left:0;right:0;bottom:.03em;height:.11em;
  background:var(--cursor);border-radius:3px;animation:latir 1s ease-in-out infinite;
}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.3}}
.car.error{background:#FFE4E6;border-radius:6px;transform:translateY(-4px) scale(1.06)}
.marcador{min-height:2.1em;font-size:clamp(1.5rem,4vw,2.5rem);font-weight:800;
  color:var(--verde);opacity:0;transition:opacity .18s}
.marcador.visible{opacity:1}
.marcador.fallo{color:var(--rojo)}

.pie{display:flex;gap:12px;align-items:center;justify-content:center;padding:14px 24px 18px;flex-wrap:wrap}
button{
  font-family:inherit;font-size:.98rem;font-weight:600;padding:10px 18px;border-radius:11px;
  border:2px solid var(--linea);background:#fff;color:var(--tinta);cursor:pointer;
  transition:transform .1s,background .15s,border-color .15s;
}
button:hover{background:#F0F5FB;border-color:#C6D4E4}
button:active{transform:translateY(2px)}
button.primario{background:var(--cursor);border-color:var(--cursor);color:#fff}
button.primario:hover{background:#1D4FD8}
.nota{font-size:.9rem;color:var(--gris);font-weight:600;text-align:center;padding:0 20px 16px}
kbd{
  background:#EEF2F8;border:1px solid #D5DFEC;border-bottom-width:3px;border-radius:6px;
  padding:1px 7px;font-family:inherit;font-weight:600;font-size:.88em;
}
@media (max-width:640px){.direccion{max-width:100%}}
</style>
</head>
<body>

<div class="barra">
  <div class="marca"><span>Á</span> Práctica de direcciones</div>
  <button id="btnOcultar">Ocultar texto</button>
  <button id="btnPantalla">Pantalla completa</button>
  <button id="btnReiniciar">Reiniciar</button>
  <div class="contador">Dirección <b id="cual">1</b> <span id="de"></span> · errores <b id="errores">0</b></div>
</div>

<div class="progreso"><i id="barra"></i></div>

<div class="escena">
  <div class="caption">Escribe la dirección con el teclado</div>
  <div class="direccion" id="linea"></div>
  <div class="marcador" id="marcador"></div>
</div>

<div class="pie">
  <button class="primario" id="btnOtra">Otra dirección</button>
</div>

<div class="nota">
  <kbd>´</kbd> + vocal = acentuada · <kbd>Shift</kbd> + <kbd>´</kbd> + <kbd>u</kbd> = <b>ü</b> ·
  <kbd>Enter</kbd> pasa de dirección · <kbd>⌫</kbd> borra
</div>

<script>
"use strict";

/* ==========================================================
   Direcciones: se cruzan calles x numeros, asi hay miles de
   combinaciones y no se repite nada en toda la clase.
   ========================================================== */
const CALLES = [
  "Reforma","Juárez","Madero","Héroes","Insurgentes","Liberación",
  "Constitución","Revolución","Cuauhtémoc","Altamira","Encino","Sabino",
  "Fresno","Roble","Olmo","Ceiba","Abeto","Cedro","Álamo","Enebro",
  "Praga","Hamburgo","Londres","París","Tokio","Berlín","Roma","Nápoles",
  "Chapultepec","Xochimilco","Churubusco","Coyoacán","Tacubaya","Mixcoac",
  "Iztacalco","Versalles","Atenas","Bélgica","Croacia","Suiza","Noruega",
  "Durango","Zaragoza","Guanajuato","Morelia","Puebla","Oaxaca",
  "Niños Héroes","Peña","Ocampo","Manteñilla","Cañada"
];
const PREFIJOS = ["", "", "", "", "", "Av. ", "Av. ", "Calle ", "Sta. "];
const NUMEROS = [1,2,3,4,5,7,8,9,10,12,14,15,16,18,20,21,24,25,27,30,32,35,
  38,40,42,45,48,50,55,60,64,70,75,80,85,90,96,100,105,110,120,125,130,
  140,150,160,175,180,190,200,210,220,240,250,260,280,300,320,350,400,450,500];

const RONDA = 120;

function construirRonda(cuantas){
  const todas = [];
  for (const calle of CALLES){
    for (const num of NUMEROS){
      const pre = PREFIJOS[Math.floor(Math.random() * PREFIJOS.length)];
      todas.push(pre + calle + " " + num);
    }
  }
  for (let i = todas.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = todas[i]; todas[i] = todas[j]; todas[j] = t;
  }
  return todas.slice(0, cuantas);
}

/* ==========================================================
   Estado
   ========================================================== */
let cola = construirRonda(RONDA);
let indice = 0;        // cuantas direcciones ya se tearon
let actual = "";
let pos = 0;           // cursor sobre la direccion
let errores = 0;
let bloqueado = false;  // durante el aviso de "Bien" no se teclea
let reloj = null;

const $ = id => document.getElementById(id);
const elLinea = $("linea"), elCual = $("cual"), elDe = $("de"),
      elErrores = $("errores"), elBarra = $("barra"), elMarcador = $("marcador");

/* ==========================================================
   Dibujar
   ========================================================== */
function pintar(){
  elLinea.textContent = "";
  const frag = document.createDocumentFragment();
  for (let i = 0; i < actual.length; i++){
    const s = document.createElement("span");
    s.className = "car " + (i < pos ? "ok" : i === pos ? "actual" : "pend");
    s.textContent = actual[i];
    frag.appendChild(s);
  }
  elLinea.appendChild(frag);
  elCual.textContent = Math.min(indice + 1, RONDA);
  elDe.textContent = "de " + RONDA;
  elErrores.textContent = errores;
  elBarra.style.width = (pos / actual.length * 100) + "%";
}

function aviso(texto, clase){
  elMarcador.textContent = texto;
  elMarcador.className = "marcador" + (texto ? " visible " + clase : "");
}

/* ==========================================================
   Avanzar
   ========================================================== */
function soltar(){
  clearTimeout(reloj);
  reloj = null;
  bloqueado = false;
}

function siguiente(){
  soltar();
  aviso("", "");
  if (indice >= cola.length){
    cola = construirRonda(RONDA);
    indice = 0;
  }
  actual = cola[indice];
  indice++;
  pos = 0;
  pintar();
}

function completar(){
  bloqueado = true;
  aviso("¡Bien!", "");
  elBarra.style.width = "100%";
  reloj = setTimeout(siguiente, 850);
}

/* ==========================================================
   Teclado
   ========================================================== */
window.addEventListener("keydown", ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (["Shift","Control","Alt","Meta","CapsLock"].includes(ev.key)) return;
  if (bloqueado) return;

  if (ev.key === "Enter"){ ev.preventDefault(); siguiente(); return; }
  if (ev.key === "Backspace"){
    ev.preventDefault();
    if (pos > 0){ pos--; pintar(); }
    return;
  }
  if (ev.key === "Tab" || ev.key === "Escape") return;
  if ([...ev.key].length !== 1) return;
  ev.preventDefault();

  if (ev.key === actual[pos]){
    pos++;
    if (pos >= actual.length){ completar(); return; }
    pintar();
  } else {
    errores++;
    pintar();
    elErrores.textContent = errores;
    const nodo = elLinea.children[pos];
    if (nodo){
      nodo.classList.add("error");
      setTimeout(() => nodo.classList.remove("error"), 420);
    }
    aviso("Casi", "fallo");
    setTimeout(() => { if (!bloqueado) aviso("", ""); }, 700);
  }
});

/* ==========================================================
   Botones
   ========================================================== */
$("btnOtra").onclick = siguiente;
$("btnReiniciar").onclick = () => {
  cola = construirRonda(RONDA);
  indice = 0;
  errores = 0;
  siguiente();
};
$("btnOcultar").onclick = function(){
  const tapado = elLinea.style.visibility === "hidden";
  elLinea.style.visibility = tapado ? "" : "hidden";
  this.textContent = tapado ? "Ocultar texto" : "Mostrar texto";
};
$("btnPantalla").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};

siguiente();
</script>
</body>
</html>
